name: Auto Bump Version

# Jalankan setiap push ke main
# KECUALI commit dari bot ini sendiri (cegah infinite loop)
on:
  push:
    branches: [main]
    paths-ignore:
      - 'version.json'
      - 'manifest.json'
      - '.github/**'
      - 'README.md'
      - 'install-update.bat'

jobs:
  bump-version:
    runs-on: ubuntu-latest

    # Jangan jalan kalau commit-nya dari GitHub Actions sendiri
    if: "!startsWith(github.event.head_commit.message, 'chore(version)')"

    permissions:
      contents: write   # Perlu untuk push balik ke repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Hitung versi baru (bump patch)
        id: bump
        run: |
          CURRENT=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "version=$NEW"     >> "$GITHUB_OUTPUT"
          echo "Versi: $CURRENT -> $NEW"

      # Nilai dioper lewat environment variable, TIDAK ditempel ke source Python.
      # Pesan commit yang mengandung tanda kutip / baris baru karena itu tidak
      # bisa merusak skrip ini.
      - name: Tulis manifest.json dan version.json
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 << 'PY'
          import json, os

          new_version = os.environ['NEW_VERSION']
          changelog = os.environ.get('COMMIT_MSG', '').splitlines()[0].strip()

          with open('manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          manifest['version'] = new_version
          with open('manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write('\n')

          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump({'version': new_version, 'changelog': changelog},
                        f, indent=2, ensure_ascii=False)
              f.write('\n')

          print(f'manifest.json + version.json -> {new_version}')
          print(f'changelog: {changelog}')
          PY

      - name: Commit & push version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json version.json
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan versi, lewati commit."
            exit 0
          fi
          git commit -m "chore(version): bump ke ${{ steps.bump.outputs.version }} [skip ci]"
          git push
          echo "Selesai: ${{ steps.bump.outputs.current }} -> ${{ steps.bump.outputs.version }}"
